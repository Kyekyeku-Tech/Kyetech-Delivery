<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F37021" />
    <title>You're offline · KyeTech Delivery</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 28px 20px; background: #fff8f1; color: #302117; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 420px); padding: 36px 28px; border: 1px solid #f1e1d2; border-radius: 28px; background: #fff; text-align: center; box-shadow: 0 12px 40px #7c411410; }
      img { width: 80px; height: 80px; border-radius: 20px; }
      .brand { margin: 16px 0 30px; font-size: 14px; font-weight: 750; color: #8b451d; }
      h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: -.6px; }
      p { margin: 0; color: #6d6057; font-size: 16px; line-height: 1.65; }
      button { display: block; width: 100%; margin: 28px 0 16px; padding: 15px 20px; border: 0; border-radius: 14px; background: #f37021; color: #fff; font: inherit; font-weight: 750; cursor: pointer; }
      button:hover { background: #d9570c; }
      button:focus-visible, a:focus-visible { outline: 3px solid #55351c; outline-offset: 4px; }
      a { color: #a13f08; font-size: 14px; font-weight: 650; }
      #connection-status { margin-top: 20px; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/pwa/icon-192.png" alt="" width="80" height="80" />
      <p class="brand">KyeTech Delivery</p>
      <h1>You're offline</h1>
      <p>Connect to the internet to request deliveries, track packages or verify your account.</p>
      <button type="button" id="retry">Try again</button>
      <a href="/">Go to home</a>
      <p id="connection-status" role="status">Your delivery information will be available when you reconnect.</p>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', () => location.reload());
      window.addEventListener('online', () => {
        document.getElementById('connection-status').textContent = "You're connected. Tap Try again to continue.";
      });
    </script>
  </body>
</html>
